<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список сериалов</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333;
            --card-bg: #ffffff;
            --imdb-color: #f5c518;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Стили загрузчика */
        #loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #ddd;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #content {
            display: none; /* Скрыт до окончания загрузки */
        }

        /* Стили категорий и карточек */
        .category-section {
            margin-bottom: 40px;
        }

        .category-title {
            font-size: 24px;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .series-card {
            display: flex;
            background-color: var(--card-bg);
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            overflow: hidden;
            transition: transform 0.2s;
			text-decoration:none;
			color:none;
        }

        .series-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .poster-container {
            flex-shrink: 0;
            width: 140px;
            background-color: #eee; /* Заглушка, пока грузится картинка */
        }

        .poster-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .series-info {
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .series-header {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .series-title {
            margin: 0;
            font-size: 20px;
            font-weight: bold;
			color:black;
        }

        .series-year {
            color: #666;
            font-size: 16px;
        }

        .series-rating {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 12px;
			color:black;
        }

        .imdb-icon {
            background-color: var(--imdb-color);
            color: #000;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 0.5px;
            display: inline-block;
        }

        .series-plot {
            margin: 0;
            line-height: 1.5;
            color: #555;
            font-size: 15px;
        }

        /* Адаптив для мобильных устройств */
        @media (max-width: 600px) {
            .series-card {
                flex-direction: column;
            }
            .poster-container {
                width: 100%;
                height: 300px;
            }
        }
    </style>
</head>
<body>

    <div id="loader-container">
        <div class="spinner"></div>
        <div>Загрузка данных...</div>
    </div>

    <div class="container" id="content">
        <!-- Сюда сгенерируются списки -->
    </div>

    <script>
        const DATA_URL = 'https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnTS_fwNg5dvoOJBvu3JLsP1ecSInOpbVye416hJB8qd4X2JSQ0QFGJWfVKVK_9fjqD54lw6Phcjon7gg4rQG8WiQkloqik_dD5Y9kSMdmdV1zalBxWjHSLCAdB3g4M7BA33_T-IQRzUC_0BnGRJGKZ0auw1wAgfnPU7V-sLXofXuqy2Xt5yzKvVTT98fb1S6M0wYRP-KS9QH1_dIqThqTmrjbhZhKbODEzjpV8mHlRXSOkstmf4HvoAJBVoWhD434SWQC-_wjhhsgqC9MiGNqC-Xzy4Yw&lib=MTxAziyImlhTIhNl9hwlnAbMPylP4P88t';

        document.addEventListener('DOMContentLoaded', () => {
            fetchDataAndRender();
        });

        async function fetchDataAndRender() {
            const loaderContainer = document.getElementById('loader-container');
            const contentContainer = document.getElementById('content');

            try {
                const response = await fetch(DATA_URL);
                if (!response.ok) throw new Error('Сетевая ошибка при запросе');
                
                const jsonData = await response.json();
                const data = jsonData.data; // Получаем массив из поля data
                
                renderContent(data, contentContainer);
                
                // Прячем загрузчик и показываем контент
                loaderContainer.style.display = 'none';
                contentContainer.style.display = 'block';

            } catch (error) {
                console.error('Ошибка загрузки данных:', error);
                loaderContainer.innerHTML = `<div style="color: red; font-weight: bold;">Ошибка загрузки данных. Пожалуйста, проверьте консоль или ссылку на JSON.</div>`;
            }
        }

        function renderContent(data, container) {
            // Перебираем каждую категорию
            data.forEach(categoryObj => {
                const section = document.createElement('div');
                section.className = 'category-section';

                // Заголовок категории
                const categoryHeader = document.createElement('h2');
                categoryHeader.className = 'category-title';
                categoryHeader.textContent = categoryObj.category;
                section.appendChild(categoryHeader);

                // Карточки сериалов в этой категории
                categoryObj.items.forEach(item => {
                    const card = document.createElement('a');
					card.href = `https://www.imdb.com/title/${item.id}/`;
					card.target = "_blank";
                    card.className = 'series-card';
					item.rating = (item.rating % parseInt(item.rating) == 0) ? item.rating + '.0' : item.rating;
                    card.innerHTML = `
                        <div class="poster-container">
                            <img src="${item.poster || ''}" alt="Постер ${item.title}" loading="lazy">
                        </div>
                        <div class="series-info">
                            <div class="series-header">
                                <h3 class="series-title">${item.title} / ${item.engTitle}</h3>
                                <span class="series-year">(${item.year})</span>
                            </div>
                            <div class="series-rating">
                                <span class="imdb-icon">IMDb</span>
                                <span>${item.rating}</span>
                            </div>
                            <p class="series-plot">${item.plot}</p>
                        </div>
                    `;
                    
                    section.appendChild(card);
                });

                container.appendChild(section);
            });
        }
    </script>
</body>
</html>
